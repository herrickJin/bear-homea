services:
  server:
    build: .
    restart: unless-stopped
    # 整份 .env 进容器（config.ts 只从进程环境读，容器内没有 .env 文件）；
    # environment 里显式列出的项优先级更高，值一致无冲突
    env_file: .env
    environment:
      - BEAR_HOME_TOKEN=${BEAR_HOME_TOKEN}
      - PORT=8787
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    expose:
      - "8787"

  # 自动 HTTPS 反向代理；BEAR_HOME_DOMAIN 留空时用 localhost 自签证书（本地联调）
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 留空/不设 = Caddy 在 80 端口提供纯 HTTP（IP 直访、无备案场景）
      # 填域名 = 自动申请 HTTPS 证书（域名需已备案并解析到本机）
      - BEAR_HOME_DOMAIN=${BEAR_HOME_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 前端静态产物（本机构建后 rsync 到 ./web），由 Caddy 直接托管
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  # Hermes Agent（Nous Research 开源自托管智能体）：常驻异步智能。
  # 职责：消费 links 队列（抓取→总结→写回）、cron 定时汇总推送、消息网关（Telegram/微信等）。
  # App 内的实时 AI 探讨不走这里，走 server 自己的 /api/chat（见 .task-docs/08-ai-assistant.md）。
  #
  # 默认不随 `docker compose up -d` 启动，启用：
  #   docker compose --profile hermes up -d
  # 国内 Docker Hub 不可达时，在 Mac 上手动导镜像（服务器是 amd64）：
  #   docker pull --platform linux/amd64 nousresearch/hermes-agent:stable
  #   docker save nousresearch/hermes-agent:stable | ssh ubuntu@<服务器IP> 'docker load'
  # 首次初始化（配模型端点与密钥）必须先进向导：deploy/hermes/README.md
  hermes:
    image: nousresearch/hermes-agent:stable
    profiles: ["hermes"]
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      # config.yaml 的 MCP headers 用 ${BEAR_HOME_TOKEN} 引用；智谱 Key 不放这里，
      # 由 bootstrap 脚本写进 hermes-data/.env（GLM_API_KEY）
      - BEAR_HOME_TOKEN=${BEAR_HOME_TOKEN}
    volumes:
      # 此镜像 HERMES_HOME=/opt/data（非 ~/.hermes）：数据/记忆/技能全在这，
      # 首次启动由镜像 init 生成完整配置，之后跑 deploy/hermes/bootstrap.sh 注入
      # 模型（provider zai / glm-5.3）、MCP（bear-home）与 SOUL.md
      - ./hermes-data:/opt/data
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:
