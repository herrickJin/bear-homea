# ⚠️ 本文件是「参考配置」，不再挂载进容器（2026-10-12 实测定稿）：
# 此镜像 HERMES_HOME=/opt/data 且自管 config.yaml，挂载覆盖会与 init 冲突。
# 实际注入走 deploy/hermes/bootstrap.sh（模型块走 hermes config set，MCP 块按下面的
# 语法追加进 /opt/data/config.yaml）。改配置 = 改 bootstrap.sh 后重跑。
#
# 模型块与用户 Mac 本地已验证的 Hermes 配置同构（provider zai / glm-5.3 / coding 端点）；
# 服务器与本地各自独立，互不影响。密钥在 hermes-data/.env（ZAI_API_KEY），不进 git。

model:
  default: glm-5.3
  provider: zai
  base_url: https://open.bigmodel.cn/api/coding/paas/v4

_config_version: 50

# 熊熊之家的数据面：server 暴露的 MCP（compose 内网服务名 server，端口 8787）
mcp_servers:
  bear-home:
    url: "http://server:8787/mcp"
    headers:
      Authorization: "Bearer ${BEAR_HOME_TOKEN}"
    tools:
      # 8 个工具全开；要收紧就改 include 列表（include 优先于 exclude）
      include:
        - list_entries
        - search_entries
        - get_entry
        - create_entry
        - list_links
        - get_link
        - save_link
        - update_link
